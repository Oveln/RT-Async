[package]
name = "demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
executor = { path = "../../modules/executor" }
platform = { path = "../../modules/platform" }
futures = { path = "../../modules/futures" }
qemu-virt = { path = "../../modules/platform/chips/qemu-virt", optional = true }
fugit = "0.4"
log = { version = "0.4", default-features = false }

[features]
std = []
qemu-virt = ["platform/riscv64", "dep:qemu-virt"]

[[bin]]
name = "async_fn"
required-features = ["qemu-virt"]

[[bin]]
name = "async_fn_macro"
required-features = ["qemu-virt"]

[[bin]]
name = "manual_future"
required-features = ["qemu-virt"]

[[bin]]
name = "preempt_test"
required-features = ["qemu-virt"]

[[bin]]
name = "timer_async"
required-features = ["qemu-virt"]
