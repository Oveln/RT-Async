[package]
name = "test"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
executor = { path = "../../modules/executor" }
platform = { path = "../../modules/platform" }
futures = { path = "../../modules/futures" }
qemu-virt = { path = "../../modules/platform/chips/qemu-virt", optional = true }
fugit = "0.4"
log = { version = "0.4", default-features = false }

[features]
qemu-virt = ["platform/riscv64", "dep:qemu-virt"]

[[bin]]
name = "smoke"
required-features = ["qemu-virt"]

[[bin]]
name = "single_task"
required-features = ["qemu-virt"]

[[bin]]
name = "fifo_same_prio"
required-features = ["qemu-virt"]

[[bin]]
name = "priority_order"
required-features = ["qemu-virt"]

[[bin]]
name = "yield_interleave"
required-features = ["qemu-virt"]

[[bin]]
name = "preempt_spawn"
required-features = ["qemu-virt"]

[[bin]]
name = "nested_preempt"
required-features = ["qemu-virt"]

[[bin]]
name = "preempt_spawn_chain"
required-features = ["qemu-virt"]

[[bin]]
name = "timer"
required-features = ["qemu-virt"]

[[bin]]
name = "timer_async"
required-features = ["qemu-virt"]

[[bin]]
name = "mutex"
required-features = ["qemu-virt"]

[[bin]]
name = "mutex_contention"
required-features = ["qemu-virt"]

[[bin]]
name = "mutex_priority"
required-features = ["qemu-virt"]
